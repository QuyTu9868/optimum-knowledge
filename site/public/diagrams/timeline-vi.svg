  <text x="1100" y="274" fill="#969698" font-size="11" text-anchor="middle">chưa được công bố</text>

  <!-- legend -->
  <g font-size="12" fill="#969698">
    <circle cx="70" cy="346" r="6" fill="#D9DADC"/><text x="84" y="350">confirmed</text>
    <circle cx="180" cy="346" r="6" fill="#282C35" stroke="#E3C27A" stroke-width="2" stroke-dasharray="3 2"/><text x="194" y="350">claimed: Optimum nói</text>
    <circle cx="350" cy="346" r="6" fill="#93C3EA"/><circle cx="350" cy="346" r="9" fill="none" stroke="#93C3EA"/><text x="366" y="350">third-party</text>
    <text x="470" y="350">Khoảng cách không theo tỷ lệ.</text>
  </g>
