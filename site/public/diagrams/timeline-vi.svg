<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="380" fill="#282C35"/>
  <!-- axis -->
  <line x1="60" y1="190" x2="1010" y2="190" stroke="#5B616D" stroke-width="2"/>
  <line x1="1010" y1="190" x2="1130" y2="190" stroke="#5B616D" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- break mark between node 1 and 2 -->
  <g stroke="#969698" stroke-width="2"><line x1="148" y1="200" x2="158" y2="180"/><line x1="158" y1="200" x2="168" y2="180"/></g>
  <rect x="150" y="186" width="16" height="8" fill="#282C35"/>
  <g stroke="#969698" stroke-width="2"><line x1="146" y1="200" x2="156" y2="180"/><line x1="160" y1="200" x2="170" y2="180"/></g>

  <!-- 1 confirmed -->
  <circle cx="80" cy="190" r="8" fill="#D9DADC"/>
  <line x1="80" y1="180" x2="80" y2="140" stroke="#5B616D"/>
  <text x="80" y="92" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Bài báo RLNC</text>
  <text x="80" y="110" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">nền tảng, công bố</text>
  <text x="80" y="128" fill="#969698" font-size="12" text-anchor="middle">2002-2006</text>

  <!-- 2 claimed -->
  <circle cx="210" cy="190" r="8" fill="#282C35" stroke="#E3C27A" stroke-width="2" stroke-dasharray="3 2"/>
