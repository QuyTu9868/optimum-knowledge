  <text x="1100" y="128" fill="#E3C27A" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">CÒN TRANH CÃI</text>
  <text x="1100" y="232" fill="#969698" font-size="11" text-anchor="middle">Nhiều khả năng: Gateway</text>
