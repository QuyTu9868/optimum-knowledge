<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="600" fill="#282C35"/><rect x="24" y="24" width="450" height="270" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><text x="44" y="54" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MỖI BÊN NHẬN MỘT KẾT NỐI</text><text x="249" y="246" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Đường ra của bên gửi được dùng chung:</text><text x="249" y="263" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">với n bên nhận, mỗi bên được khoảng 1/n.</text><line x1="130" y1="144" x2="364" y2="94" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="380" cy="94" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="130" y1="144" x2="364" y2="144" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="380" cy="144" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="130" y1="144" x2="364" y2="194" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="380" cy="194" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><circle cx="114" cy="144" r="18" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><text x="114" y="184" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bên gửi</text><rect x="486" y="24" width="450" height="270" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><text x="506" y="54" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">CÂY MULTICAST</text><text x="711" y="246" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Mỗi đường dùng chung có một bản sao đi qua.</text><text x="711" y="263" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Tìm cây tốt trong mesh dày là bài toán NP-khó.</text><line x1="572" y1="144" x2="670" y2="104" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="686" cy="104" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="572" y1="144" x2="670" y2="184" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="686" cy="184" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="702" y1="104" x2="822" y2="84" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="836" cy="84" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="702" y1="104" x2="822" y2="124" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="836" cy="124" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="702" y1="184" x2="822" y2="164" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="836" cy="164" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><line x1="702" y1="184" x2="822" y2="204" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><circle cx="836" cy="204" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><circle cx="556" cy="144" r="18" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><text x="556" y="184" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bên gửi</text><rect x="24" y="310" width="450" height="270" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><text x="44" y="340" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MESH GOSSIP</text><text x="249" y="532" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Gossip không mã hóa chống mất gói bằng cách</text><text x="249" y="549" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">hạn chế số chặng, thông lượng giảm theo chặng.</text><line x1="114" y1="440" x2="209" y2="390" stroke="#5B616D" stroke-width="1.4"/><line x1="114" y1="440" x2="209" y2="490" stroke="#5B616D" stroke-width="1.4"/><line x1="209" y1="390" x2="209" y2="490" stroke="#5B616D" stroke-width="1.4"/><line x1="209" y1="390" x2="309" y2="400" stroke="#5B616D" stroke-width="1.4"/><line x1="209" y1="390" x2="309" y2="480" stroke="#5B616D" stroke-width="1.4"/><line x1="209" y1="490" x2="309" y2="400" stroke="#5B616D" stroke-width="1.4"/><line x1="209" y1="490" x2="309" y2="480" stroke="#5B616D" stroke-width="1.4"/><line x1="309" y1="400" x2="394" y2="440" stroke="#5B616D" stroke-width="1.4"/><line x1="309" y1="480" x2="394" y2="440" stroke="#5B616D" stroke-width="1.4"/><circle cx="114" cy="440" r="17" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><circle cx="209" cy="390" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><circle cx="209" cy="490" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><circle cx="309" cy="400" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><circle cx="309" cy="480" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.6"/><circle cx="394" cy="440" r="17" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><text x="114" y="478" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bên gửi</text><text x="394" y="478" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bên nhận</text><rect x="486" y="310" width="450" height="270" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><text x="506" y="340" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MESH MÃ HÓA</text><text x="711" y="532" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Mọi kết nối đều mang được phương trình và relay</text><text x="711" y="549" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">tái mã hóa: thông lượng giữ ở mức tối ưu một đường,</text><text x="711" y="566" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">đổi lại là nhiều chặng hơn và chút trễ thêm.</text><line x1="576" y1="440" x2="671" y2="390" stroke="#A6B0FF" stroke-width="1.8"/><line x1="576" y1="440" x2="671" y2="490" stroke="#A6B0FF" stroke-width="1.8"/><line x1="671" y1="390" x2="671" y2="490" stroke="#A6B0FF" stroke-width="1.8"/><line x1="671" y1="390" x2="771" y2="400" stroke="#A6B0FF" stroke-width="1.8"/><line x1="671" y1="390" x2="771" y2="480" stroke="#A6B0FF" stroke-width="1.8"/><line x1="671" y1="490" x2="771" y2="400" stroke="#A6B0FF" stroke-width="1.8"/><line x1="671" y1="490" x2="771" y2="480" stroke="#A6B0FF" stroke-width="1.8"/><line x1="771" y1="400" x2="856" y2="440" stroke="#A6B0FF" stroke-width="1.8"/><line x1="771" y1="480" x2="856" y2="440" stroke="#A6B0FF" stroke-width="1.8"/><circle cx="576" cy="440" r="17" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><circle cx="671" cy="390" r="14" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><circle cx="671" cy="490" r="14" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><circle cx="771" cy="400" r="14" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><circle cx="771" cy="480" r="14" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><circle cx="856" cy="440" r="17" fill="#434A78" stroke="#A6B0FF" stroke-width="1.6"/><text x="576" y="478" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bên gửi</text><text x="856" y="478" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bên nhận</text></svg>