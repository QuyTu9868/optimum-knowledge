<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="500" fill="#282C35"/><text x="28" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MÃ HÓA ĐẦU CUỐI (END-TO-END)</text><rect x="28" y="54" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="88.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Nguồn</text><rect x="300" y="54" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="360.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 1</text><rect x="530" y="54" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="590.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 2</text><rect x="790" y="54" width="140" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="860.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Bên nhận</text><line x1="148" y1="81" x2="296" y2="81" stroke="#969698" stroke-width="1.8" marker-end="url(#a)"/><line x1="214" y1="73" x2="230" y2="89" stroke="#E5A3A3" stroke-width="2.4"/><line x1="214" y1="89" x2="230" y2="73" stroke="#E5A3A3" stroke-width="2.4"/><line x1="420" y1="81" x2="526" y2="81" stroke="#969698" stroke-width="1.8" marker-end="url(#a)"/><line x1="465" y1="73" x2="481" y2="89" stroke="#E5A3A3" stroke-width="2.4"/><line x1="465" y1="89" x2="481" y2="73" stroke="#E5A3A3" stroke-width="2.4"/><line x1="650" y1="81" x2="786" y2="81" stroke="#969698" stroke-width="1.8" marker-end="url(#a)"/><line x1="710" y1="73" x2="726" y2="89" stroke="#E5A3A3" stroke-width="2.4"/><line x1="710" y1="89" x2="726" y2="73" stroke="#E5A3A3" stroke-width="2.4"/><text x="480" y="156" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">Mất mát của mọi chặng cộng dồn, nên nguồn phải bù trước cho cả ba đường truyền.</text><text x="28" y="204" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">TÁI MÃ HÓA (RECODING) TẠI MỖI RELAY</text><rect x="28" y="224" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="88.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Nguồn</text><rect x="300" y="224" width="120" height="54" rx="10" fill="#30353F" stroke="#A6B0FF" stroke-width="1.3"/><text x="360.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 1</text><rect x="314" y="286" width="92" height="24" rx="12" fill="rgba(166,176,255,0.12)" stroke="none" stroke-width="0"/><text x="360.0" y="302.5" fill="#A6B0FF" font-size="12" font-weight="600" text-anchor="middle">tái mã hóa</text><rect x="530" y="224" width="120" height="54" rx="10" fill="#30353F" stroke="#A6B0FF" stroke-width="1.3"/><text x="590.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 2</text><rect x="544" y="286" width="92" height="24" rx="12" fill="rgba(166,176,255,0.12)" stroke="none" stroke-width="0"/><text x="590.0" y="302.5" fill="#A6B0FF" font-size="12" font-weight="600" text-anchor="middle">tái mã hóa</text><rect x="790" y="224" width="140" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="860.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Bên nhận</text><line x1="148" y1="251" x2="296" y2="251" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="214" y1="243" x2="230" y2="259" stroke="#E5A3A3" stroke-width="2.4"/><line x1="214" y1="259" x2="230" y2="243" stroke="#E5A3A3" stroke-width="2.4"/><line x1="420" y1="251" x2="526" y2="251" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="465" y1="243" x2="481" y2="259" stroke="#E5A3A3" stroke-width="2.4"/><line x1="465" y1="259" x2="481" y2="243" stroke="#E5A3A3" stroke-width="2.4"/><line x1="650" y1="251" x2="786" y2="251" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="710" y1="243" x2="726" y2="259" stroke="#E5A3A3" stroke-width="2.4"/><line x1="710" y1="259" x2="726" y2="243" stroke="#E5A3A3" stroke-width="2.4"/><text x="480" y="336" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">Mỗi chặng tự bù mất mát của mình, nên chất lượng theo mắt xích yếu nhất.</text><text x="28" y="358" fill="#E5A3A3" font-size="12.5" font-weight="400" text-anchor="start">x = shard bị mất trên đường truyền đó</text><rect x="24" y="380" width="912" height="100" rx="10" fill="#3A3F4A" stroke="#5B616D" stroke-width="1.2"/><text x="44" y="408" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">VÍ DỤ RIÊNG CỦA OPTIMUM (chuỗi ngắn hơn: nguồn, một relay, bên nhận; mỗi đường mất một gói)</text><text x="44" y="436" fill="#D9DADC" font-size="13.5" font-weight="400" text-anchor="start">Relay chỉ chuyển tiếp: 9 lượt truyền.</text><text x="44" y="458" fill="#D9DADC" font-size="13.5" font-weight="400" text-anchor="start">Giải mã rồi mã hóa lại ở giữa: 8 lượt truyền, 8 bước thời gian.</text><text x="520" y="436" fill="#A6B0FF" font-size="13.5" font-weight="600" text-anchor="start">Tái mã hóa, không giải mã: 8 lượt, 5 bước</text><text x="520" y="458" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="start">(hai đường truyền chạy theo kiểu pipeline)</text></svg>