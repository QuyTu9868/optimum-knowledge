<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F97BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="440" fill="#171B2E"/><text x="28" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">ORIGINAL DATA</text><text x="290" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">CODED SHARDS</text><text x="540" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">RELAY NODE</text><text x="770" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">RECEIVER</text><rect x="28" y="66" width="62" height="50" rx="7" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><text x="59.0" y="97.12" fill="#F2F2F3" font-size="17" font-weight="600" text-anchor="middle">x1</text><rect x="100" y="66" width="62" height="50" rx="7" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><text x="131.0" y="97.12" fill="#F2F2F3" font-size="17" font-weight="600" text-anchor="middle">x2</text><rect x="172" y="66" width="62" height="50" rx="7" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><text x="203.0" y="97.12" fill="#F2F2F3" font-size="17" font-weight="600" text-anchor="middle">x3</text><text x="125" y="142" fill="#B4B9D6" font-size="13" font-weight="400" text-anchor="middle">k = 3 pieces</text><text x="125" y="196" fill="#D6D9EA" font-size="13" font-weight="400" text-anchor="middle">Every shard is a</text><text x="125" y="215" fill="#D6D9EA" font-size="13" font-weight="400" text-anchor="middle">random mix of the</text><text x="125" y="234" fill="#D6D9EA" font-size="13" font-weight="400" text-anchor="middle">pieces</text><line x1="242" y1="92" x2="282" y2="92" stroke="#A6B0FF" stroke-width="2" marker-end="url(#al)"/><text x="251" y="80" fill="#A6B0FF" font-size="12.5" font-weight="600" text-anchor="middle">mix</text><rect x="290" y="62" width="130" height="40" rx="7" fill="#272D50" stroke="#A6B0FF" stroke-width="1.5"/><text x="355.0" y="86.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">mix A</text><rect x="290" y="114" width="130" height="40" rx="7" fill="#272D50" stroke="#A6B0FF" stroke-width="1.5"/><text x="355.0" y="138.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">mix B</text><rect x="290" y="166" width="130" height="40" rx="7" fill="#272D50" stroke="#A6B0FF" stroke-width="1.5"/><text x="355.0" y="190.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">mix C</text><rect x="290" y="218" width="130" height="40" rx="7" fill="#272D50" stroke="#E5A3A3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="355.0" y="242.68" fill="#B4B9D6" font-size="13" font-weight="600" text-anchor="middle">mix D</text><line x1="431" y1="229" x2="449" y2="247" stroke="#E5A3A3" stroke-width="2.4"/><line x1="431" y1="247" x2="449" y2="229" stroke="#E5A3A3" stroke-width="2.4"/><text x="458" y="243" fill="#E5A3A3" font-size="12.5" font-weight="600" text-anchor="start">lost</text><text x="355" y="296" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">n shards, n can be larger</text><text x="355" y="313" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">than k. Lost ones do not</text><text x="355" y="330" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">matter if k independent</text><text x="355" y="347" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">mixes still arrive</text><rect x="540" y="62" width="190" height="130" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="635.0" y="106.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay</text><text x="635.0" y="131.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">mixes the shards it holds</text><text x="635.0" y="148.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">into a new shard,</text><text x="635.0" y="165.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">without decoding</text><line x1="424" y1="82" x2="536" y2="100" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="424" y1="134" x2="536" y2="134" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="424" y1="186" x2="536" y2="168" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><rect x="570" y="222" width="130" height="40" rx="7" fill="rgba(166,176,255,0.14)" stroke="#A6B0FF" stroke-width="1.5"/><text x="635.0" y="246.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">new mix E</text><line x1="635" y1="194" x2="635" y2="218" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><text x="635" y="288" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">Docs: peer shards are recoded</text><text x="635" y="305" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">after enough of them arrived</text><rect x="770" y="62" width="166" height="130" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="853.0" y="106.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Receiver</text><text x="853.0" y="131.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">needs any k</text><text x="853.0" y="148.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">independent mixes</text><text x="853.0" y="165.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">(here k = 3)</text><line x1="734" y1="110" x2="766" y2="110" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="704" y1="242" x2="792" y2="198" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="853" y1="196" x2="853" y2="236" stroke="#A6B0FF" stroke-width="2" marker-end="url(#al)"/><text x="865" y="222" fill="#A6B0FF" font-size="12.5" font-weight="600" text-anchor="start">solve</text><rect x="770" y="244" width="50" height="44" rx="7" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><text x="795.0" y="271.76" fill="#F2F2F3" font-size="16" font-weight="600" text-anchor="middle">x1</text><rect x="828" y="244" width="50" height="44" rx="7" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><text x="853.0" y="271.76" fill="#F2F2F3" font-size="16" font-weight="600" text-anchor="middle">x2</text><rect x="886" y="244" width="50" height="44" rx="7" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><text x="911.0" y="271.76" fill="#F2F2F3" font-size="16" font-weight="600" text-anchor="middle">x3</text><text x="853" y="312" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">original data rebuilt</text><text x="28" y="420" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="start">Illustration. Real systems compute the mixes over a finite field.</text></svg>