<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F97BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="470" fill="#171B2E"/><text x="40" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MỘT SLOT ETHEREUM: 12 GIÂY</text><rect x="40" y="50" width="880" height="46" rx="8" fill="#1E2340" stroke="#4A5280" stroke-width="1.2"/><rect x="40" y="50" width="293" height="46" rx="8" fill="rgba(166,176,255,0.20)" stroke="#A6B0FF" stroke-width="1.5"/><text x="186" y="78" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">khoảng 4 giây</text><text x="626" y="78" fill="#B4B9D6" font-size="14" font-weight="400" text-anchor="middle">phần còn lại của 12 giây</text><text x="186" y="124" fill="#D6D9EA" font-size="13" font-weight="400" text-anchor="middle">Validator thống nhất về head</text><text x="186" y="142" fill="#D6D9EA" font-size="13" font-weight="400" text-anchor="middle">của chuỗi</text><text x="626" y="124" fill="#E3C27A" font-size="13" font-weight="400" text-anchor="middle">Thời gian dành cho dữ liệu cũ bị trừ vào quỹ thời gian này.</text><line x1="40" y1="150" x2="920" y2="150" stroke="#4A5280" stroke-width="1"/><text x="40" y="178" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">AI MẤT NHIỀU THỜI GIAN HƠN (LẬP LUẬN CỦA MÉDARD)</text><rect x="40" y="230" width="130" height="70" rx="10" fill="#272D50" stroke="#8F97BF" stroke-width="1.3"/><text x="105.0" y="261.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Nguồn khối</text><text x="105.0" y="286.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">builder, proposer</text><circle cx="270" cy="250" r="14" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><circle cx="270" cy="280" r="14" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><line x1="174" y1="258" x2="250" y2="252" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><line x1="174" y1="272" x2="250" y2="278" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><text x="272" y="320" fill="#F2F2F3" font-size="13.5" font-weight="600" text-anchor="middle">Gần nguồn</text><text x="272" y="340" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">khối đến sớm,</text><text x="272" y="357" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">bản lặp ít tốn kém hơn</text><circle cx="740" cy="250" r="14" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><circle cx="740" cy="280" r="14" fill="#272D50" stroke="#8F97BF" stroke-width="1.5"/><path d="M174 254 C 400 200, 520 200, 716 248" stroke="#E3C27A" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#aw)"/><path d="M174 276 C 400 312, 520 312, 716 282" stroke="#E3C27A" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#aw)"/><text x="450" y="204" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">đường dài, các bản lặp chồng chất</text><text x="742" y="320" fill="#F2F2F3" font-size="13.5" font-weight="600" text-anchor="middle">Xa nguồn</text><text x="742" y="340" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">thấy thông tin cũ hơn,</text><text x="742" y="357" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">bản lặp gây hại nhiều hơn</text><text x="272" y="376" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">gần nguồn có giá: colocation (đặt máy cùng vị trí)</text><rect x="40" y="392" width="880" height="56" rx="10" fill="rgba(166,176,255,0.12)" stroke="#A6B0FF" stroke-width="1.4"/><text x="480" y="416" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Với tổ hợp mã hóa, mọi shard nhận được đều có giá trị, nên validator ở xa mất ít thời gian hơn.</text><text x="480" y="436" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">Tuyên bố của Optimum: giúp validator ở các vị trí khác nhau ngang bằng hơn.</text></svg>