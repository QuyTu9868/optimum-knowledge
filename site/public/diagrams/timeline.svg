  <text x="1100" y="260" fill="#8F97BF" font-size="11" text-anchor="middle">differ by source</text>

  <!-- legend -->
  <g font-size="12" fill="#8F97BF">
    <circle cx="70" cy="346" r="6" fill="#D6D9EA"/><text x="84" y="350">confirmed</text>
    <circle cx="180" cy="346" r="6" fill="#171B2E" stroke="#E3C27A" stroke-width="2" stroke-dasharray="3 2"/><text x="194" y="350">claimed by Optimum</text>
    <circle cx="350" cy="346" r="6" fill="#93C3EA"/><circle cx="350" cy="346" r="9" fill="none" stroke="#93C3EA"/><text x="366" y="350">third-party</text>
    <text x="470" y="350">Spacing is not to scale.</text>
  </g>
