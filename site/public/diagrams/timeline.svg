<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="380" fill="#171B2E"/>
  <!-- axis -->
  <line x1="60" y1="190" x2="1010" y2="190" stroke="#4A5280" stroke-width="2"/>
  <line x1="1010" y1="190" x2="1130" y2="190" stroke="#4A5280" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- break mark between node 1 and 2 -->
  <g stroke="#8F97BF" stroke-width="2"><line x1="148" y1="200" x2="158" y2="180"/><line x1="158" y1="200" x2="168" y2="180"/></g>
  <rect x="150" y="186" width="16" height="8" fill="#171B2E"/>
  <g stroke="#8F97BF" stroke-width="2"><line x1="146" y1="200" x2="156" y2="180"/><line x1="160" y1="200" x2="170" y2="180"/></g>

  <!-- 1 confirmed -->
  <circle cx="80" cy="190" r="8" fill="#D6D9EA"/>
  <line x1="80" y1="180" x2="80" y2="140" stroke="#4A5280"/>
  <text x="80" y="92" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Core RLNC</text>
  <text x="80" y="110" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">papers published</text>
  <text x="80" y="128" fill="#8F97BF" font-size="12" text-anchor="middle">2002-2006</text>

  <!-- 2 claimed -->
  <circle cx="210" cy="190" r="8" fill="#171B2E" stroke="#E3C27A" stroke-width="2" stroke-dasharray="3 2"/>
  <line x1="210" y1="200" x2="210" y2="240" stroke="#4A5280"/>
  <text x="210" y="262" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Optimum founded</text>
  <text x="210" y="280" fill="#8F97BF" font-size="12" text-anchor="middle">2024</text>

  <!-- 3 confirmed -->
  <circle cx="330" cy="190" r="8" fill="#D6D9EA"/>
  <line x1="330" y1="180" x2="330" y2="140" stroke="#4A5280"/>
