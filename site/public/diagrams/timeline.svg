  <text x="330" y="110" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">$11M seed (1kx)</text>
  <text x="330" y="128" fill="#8F97BF" font-size="12" text-anchor="middle">2025-04-15</text>

  <!-- 4 third-party -->
  <circle cx="450" cy="190" r="8" fill="#93C3EA"/><circle cx="450" cy="190" r="12" fill="none" stroke="#93C3EA" stroke-width="1.5"/>
  <line x1="450" y1="202" x2="450" y2="240" stroke="#4A5280"/>
