  <text x="690" y="280" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">mainnet test call</text>
  <text x="690" y="298" fill="#8F97BF" font-size="12" text-anchor="middle">2026-08-10</text>

