  <text x="450" y="280" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Hoodi tests</text>
  <text x="450" y="298" fill="#8F97BF" font-size="12" text-anchor="middle">2025-09-23</text>

  <!-- 5 confirmed -->
