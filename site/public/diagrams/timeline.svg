  <text x="570" y="128" fill="#8F97BF" font-size="12" text-anchor="middle">2026-07-20</text>

  <!-- 6 confirmed -->
  <circle cx="690" cy="190" r="8" fill="#D6D9EA"/>
  <line x1="690" y1="200" x2="690" y2="240" stroke="#4A5280"/>
