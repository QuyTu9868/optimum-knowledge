  <circle cx="1100" cy="190" r="10" fill="#171B2E" stroke="#E3C27A" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="1100" y1="178" x2="1100" y2="140" stroke="#4A5280"/>
  <text x="1100" y="74" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">mump2p live on</text>
