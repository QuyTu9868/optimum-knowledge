<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="520" fill="#282C35"/><text x="24" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">SENDER SIDE</text><rect x="24" y="48" width="170" height="56" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="109.0" y="72.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Block builder</text><text x="109.0" y="97.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">assembles a block</text><rect x="24" y="150" width="170" height="56" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="109.0" y="174.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Proposer</text><text x="109.0" y="199.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">sends the block out</text><line x1="109" y1="108" x2="109" y2="146" stroke="#969698" stroke-width="1.6" marker-end="url(#a)"/><text x="330" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">FLEXNODES ON THE PATH</text><rect x="330" y="48" width="230" height="70" rx="10" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.3"/><text x="445.0" y="71.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Flexnode</text><text x="445.0" y="96.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">regenerates new coded</text><text x="445.0" y="113.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">equations on the path</text><line x1="198" y1="178" x2="326" y2="83" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><rect x="330" y="148" width="230" height="70" rx="10" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.3"/><text x="445.0" y="171.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Flexnode</text><text x="445.0" y="196.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">regenerates new coded</text><text x="445.0" y="213.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">equations on the path</text><line x1="198" y1="178" x2="326" y2="183" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><rect x="330" y="248" width="230" height="70" rx="10" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.3"/><text x="445.0" y="271.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Flexnode</text><text x="445.0" y="296.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">regenerates new coded</text><text x="445.0" y="313.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">equations on the path</text><line x1="198" y1="178" x2="326" y2="283" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><text x="724" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">RECEIVERS</text><rect x="724" y="48" width="212" height="232" rx="12" fill="#30353F" stroke="#969698" stroke-width="1.3"/><rect x="740" y="66" width="180" height="90" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="830.0" y="99.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Validator</text><text x="830.0" y="124.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">may also run</text><text x="830.0" y="141.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">a Flexnode</text><rect x="740" y="172" width="180" height="90" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="830.0" y="205.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Other receivers</text><text x="830.0" y="230.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">for example</text><text x="830.0" y="247.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">block builders</text><line x1="564" y1="83" x2="720" y2="73" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><line x1="564" y1="183" x2="720" y2="173" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><line x1="564" y1="283" x2="720" y2="245" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><text x="642" y="64" fill="#A6B0FF" font-size="12.5" font-weight="600" text-anchor="middle">equations</text><path d="M830 284 C 830 400, 450 410, 450 340" stroke="#E3C27A" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#aw)"/><text x="640" y="408" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">Planned: the receiver pays each Flexnode that supplies equations</text><text x="640" y="428" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">(not running yet)</text><rect x="24" y="452" width="440" height="56" rx="10" fill="#3A3F4A" stroke="#5B616D" stroke-width="1.2"/><text x="244" y="474" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Flexnodes are described as helping propagation.</text><text x="244" y="492" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Data at rest (DeRAM) is planned for later.</text><rect x="484" y="452" width="452" height="56" rx="10" fill="#3A3F4A" stroke="#5B616D" stroke-width="1.2"/><text x="710" y="474" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">No slashing is planned: an offline Flexnode just earns</text><text x="710" y="492" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">nothing and the coded mesh keeps working.</text></svg>