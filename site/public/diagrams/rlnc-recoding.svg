<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="500" fill="#282C35"/><text x="28" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">END-TO-END CODING</text><rect x="28" y="54" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="88.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Source</text><rect x="300" y="54" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="360.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 1</text><rect x="530" y="54" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="590.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 2</text><rect x="790" y="54" width="140" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="860.0" y="86.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Receiver</text><line x1="148" y1="81" x2="296" y2="81" stroke="#969698" stroke-width="1.8" marker-end="url(#a)"/><line x1="214" y1="73" x2="230" y2="89" stroke="#E5A3A3" stroke-width="2.4"/><line x1="214" y1="89" x2="230" y2="73" stroke="#E5A3A3" stroke-width="2.4"/><line x1="420" y1="81" x2="526" y2="81" stroke="#969698" stroke-width="1.8" marker-end="url(#a)"/><line x1="465" y1="73" x2="481" y2="89" stroke="#E5A3A3" stroke-width="2.4"/><line x1="465" y1="89" x2="481" y2="73" stroke="#E5A3A3" stroke-width="2.4"/><line x1="650" y1="81" x2="786" y2="81" stroke="#969698" stroke-width="1.8" marker-end="url(#a)"/><line x1="710" y1="73" x2="726" y2="89" stroke="#E5A3A3" stroke-width="2.4"/><line x1="710" y1="89" x2="726" y2="73" stroke="#E5A3A3" stroke-width="2.4"/><text x="480" y="156" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">The losses of every hop add up, so the source must cover all three links in advance.</text><text x="28" y="204" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">RECODING AT EACH RELAY</text><rect x="28" y="224" width="120" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="88.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Source</text><rect x="300" y="224" width="120" height="54" rx="10" fill="#30353F" stroke="#A6B0FF" stroke-width="1.3"/><text x="360.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 1</text><rect x="314" y="286" width="92" height="24" rx="12" fill="rgba(166,176,255,0.12)" stroke="none" stroke-width="0"/><text x="360.0" y="302.5" fill="#A6B0FF" font-size="12" font-weight="600" text-anchor="middle">recodes</text><rect x="530" y="224" width="120" height="54" rx="10" fill="#30353F" stroke="#A6B0FF" stroke-width="1.3"/><text x="590.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay 2</text><rect x="544" y="286" width="92" height="24" rx="12" fill="rgba(166,176,255,0.12)" stroke="none" stroke-width="0"/><text x="590.0" y="302.5" fill="#A6B0FF" font-size="12" font-weight="600" text-anchor="middle">recodes</text><rect x="790" y="224" width="140" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="860.0" y="256.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Receiver</text><line x1="148" y1="251" x2="296" y2="251" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="214" y1="243" x2="230" y2="259" stroke="#E5A3A3" stroke-width="2.4"/><line x1="214" y1="259" x2="230" y2="243" stroke="#E5A3A3" stroke-width="2.4"/><line x1="420" y1="251" x2="526" y2="251" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="465" y1="243" x2="481" y2="259" stroke="#E5A3A3" stroke-width="2.4"/><line x1="465" y1="259" x2="481" y2="243" stroke="#E5A3A3" stroke-width="2.4"/><line x1="650" y1="251" x2="786" y2="251" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="710" y1="243" x2="726" y2="259" stroke="#E5A3A3" stroke-width="2.4"/><line x1="710" y1="259" x2="726" y2="243" stroke="#E5A3A3" stroke-width="2.4"/><text x="480" y="336" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">Each hop repairs its own loss, so quality follows the weakest link.</text><text x="28" y="364" fill="#E5A3A3" font-size="13" font-weight="400" text-anchor="start">x = a lost shard on that link</text><rect x="24" y="380" width="912" height="100" rx="10" fill="#3A3F4A" stroke="#5B616D" stroke-width="1.2"/><text x="44" y="408" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">OPTIMUM'S OWN EXAMPLE (a shorter chain: source, one relay, receiver; one loss per link)</text><text x="44" y="436" fill="#D9DADC" font-size="13.5" font-weight="400" text-anchor="start">Forward-only relays: 9 transmissions.</text><text x="44" y="458" fill="#D9DADC" font-size="13.5" font-weight="400" text-anchor="start">Decode and re-encode in the middle: 8 transmissions, 8 time slots.</text><text x="520" y="436" fill="#A6B0FF" font-size="13.5" font-weight="600" text-anchor="start">Recode, no decoding: 8 transmissions, 5 slots</text><text x="520" y="458" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="start">(both links work in a pipeline)</text></svg>