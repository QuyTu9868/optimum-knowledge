<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="470" fill="#282C35"/><text x="40" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">ONE ETHEREUM SLOT: 12 SECONDS</text><rect x="40" y="50" width="880" height="46" rx="8" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><rect x="40" y="50" width="293" height="46" rx="8" fill="rgba(166,176,255,0.20)" stroke="#A6B0FF" stroke-width="1.5"/><text x="186" y="78" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">about 4 s</text><text x="626" y="78" fill="#B4B6BC" font-size="14" font-weight="400" text-anchor="middle">the rest of the 12 seconds</text><text x="186" y="124" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">Validators agree on the head</text><text x="186" y="142" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">of the chain</text><text x="626" y="124" fill="#E3C27A" font-size="13" font-weight="400" text-anchor="middle">Time spent on stale data is lost from this budget.</text><line x1="40" y1="150" x2="920" y2="150" stroke="#5B616D" stroke-width="1"/><text x="40" y="178" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">WHO LOSES MORE TIME (MEDARD'S ARGUMENT)</text><rect x="40" y="230" width="130" height="70" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="105.0" y="261.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Block source</text><text x="105.0" y="286.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">builder, proposer</text><circle cx="270" cy="250" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><circle cx="270" cy="280" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><line x1="174" y1="258" x2="250" y2="252" stroke="#969698" stroke-width="1.6" marker-end="url(#a)"/><line x1="174" y1="272" x2="250" y2="278" stroke="#969698" stroke-width="1.6" marker-end="url(#a)"/><text x="272" y="320" fill="#F2F2F3" font-size="13.5" font-weight="600" text-anchor="middle">Near the source</text><text x="272" y="340" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">blocks arrive early,</text><text x="272" y="357" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">repeats cost less</text><circle cx="740" cy="250" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><circle cx="740" cy="280" r="14" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><path d="M174 254 C 400 200, 520 200, 716 248" stroke="#E3C27A" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#aw)"/><path d="M174 276 C 400 312, 520 312, 716 282" stroke="#E3C27A" stroke-width="1.8" fill="none" stroke-dasharray="7 5" marker-end="url(#aw)"/><text x="450" y="204" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">long path, repeated copies pile up</text><text x="742" y="320" fill="#F2F2F3" font-size="13.5" font-weight="600" text-anchor="middle">Far from the source</text><text x="742" y="340" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">sees older information,</text><text x="742" y="357" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">repeats hurt more</text><text x="272" y="376" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">so being close earns a premium: colocation</text><rect x="40" y="392" width="880" height="56" rx="10" fill="rgba(166,176,255,0.12)" stroke="#A6B0FF" stroke-width="1.4"/><text x="480" y="416" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">With coded mixes every incoming piece counts, so far-away validators lose less time.</text><text x="480" y="436" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">Optimum's claim: it keeps validators in different places on a more equal footing.</text></svg>