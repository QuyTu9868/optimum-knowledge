<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="440" fill="#282C35"/><text x="28" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">DỮ LIỆU GỐC</text><text x="290" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">SHARD MÃ HÓA</text><text x="540" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">NÚT RELAY</text><text x="770" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">BÊN NHẬN</text><rect x="28" y="66" width="62" height="50" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="59.0" y="97.12" fill="#F2F2F3" font-size="17" font-weight="600" text-anchor="middle">x1</text><rect x="100" y="66" width="62" height="50" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="131.0" y="97.12" fill="#F2F2F3" font-size="17" font-weight="600" text-anchor="middle">x2</text><rect x="172" y="66" width="62" height="50" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="203.0" y="97.12" fill="#F2F2F3" font-size="17" font-weight="600" text-anchor="middle">x3</text><text x="125" y="142" fill="#B4B6BC" font-size="13" font-weight="400" text-anchor="middle">k = 3 mảnh</text><text x="125" y="196" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">Mỗi shard là một</text><text x="125" y="215" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">tổ hợp ngẫu nhiên</text><text x="125" y="234" fill="#D9DADC" font-size="13" font-weight="400" text-anchor="middle">của các mảnh</text><line x1="242" y1="92" x2="282" y2="92" stroke="#A6B0FF" stroke-width="2" marker-end="url(#al)"/><text x="251" y="80" fill="#A6B0FF" font-size="12.5" font-weight="600" text-anchor="middle">trộn</text><rect x="290" y="62" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.5"/><text x="355.0" y="86.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">tổ hợp A</text><rect x="290" y="114" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.5"/><text x="355.0" y="138.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">tổ hợp B</text><rect x="290" y="166" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.5"/><text x="355.0" y="190.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">tổ hợp C</text><rect x="290" y="218" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#E5A3A3" stroke-width="1.5" stroke-dasharray="5 4"/><text x="355.0" y="242.68" fill="#B4B6BC" font-size="13" font-weight="600" text-anchor="middle">tổ hợp D</text><line x1="431" y1="229" x2="449" y2="247" stroke="#E5A3A3" stroke-width="2.4"/><line x1="431" y1="247" x2="449" y2="229" stroke="#E5A3A3" stroke-width="2.4"/><text x="458" y="243" fill="#E5A3A3" font-size="12.5" font-weight="600" text-anchor="start">mất</text><text x="355" y="296" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">n shard, n có thể lớn hơn k.</text><text x="355" y="313" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">Mất vài shard không sao nếu</text><text x="355" y="330" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">vẫn nhận đủ k tổ hợp độc lập</text><text x="355" y="347" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle"></text><rect x="540" y="62" width="190" height="130" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="635.0" y="106.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Relay</text><text x="635.0" y="131.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">trộn các shard đang giữ</text><text x="635.0" y="148.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">thành một shard mới,</text><text x="635.0" y="165.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">không cần giải mã</text><line x1="424" y1="82" x2="536" y2="100" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="424" y1="134" x2="536" y2="134" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="424" y1="186" x2="536" y2="168" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><rect x="570" y="222" width="130" height="40" rx="7" fill="rgba(166,176,255,0.14)" stroke="#A6B0FF" stroke-width="1.5"/><text x="635.0" y="246.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">tổ hợp mới E</text><line x1="635" y1="194" x2="635" y2="218" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><text x="635" y="288" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">Theo docs: shard từ peer được</text><text x="635" y="305" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">tái mã hóa khi đã nhận đủ</text><rect x="770" y="62" width="166" height="130" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="853.0" y="106.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Bên nhận</text><text x="853.0" y="131.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">cần k tổ hợp độc lập</text><text x="853.0" y="148.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bất kỳ</text><text x="853.0" y="165.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">(ở đây k = 3)</text><line x1="734" y1="110" x2="766" y2="110" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="704" y1="242" x2="792" y2="198" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)"/><line x1="853" y1="196" x2="853" y2="236" stroke="#A6B0FF" stroke-width="2" marker-end="url(#al)"/><text x="865" y="222" fill="#A6B0FF" font-size="12.5" font-weight="600" text-anchor="start">giải</text><rect x="770" y="244" width="50" height="44" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="795.0" y="271.76" fill="#F2F2F3" font-size="16" font-weight="600" text-anchor="middle">x1</text><rect x="828" y="244" width="50" height="44" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="853.0" y="271.76" fill="#F2F2F3" font-size="16" font-weight="600" text-anchor="middle">x2</text><rect x="886" y="244" width="50" height="44" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="911.0" y="271.76" fill="#F2F2F3" font-size="16" font-weight="600" text-anchor="middle">x3</text><text x="853" y="312" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">dữ liệu gốc được dựng lại</text><text x="28" y="420" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="start">Minh họa. Hệ thống thật tính các tổ hợp trên trường hữu hạn (finite field).</text></svg>