<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F97BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="590" fill="#171B2E"/><text x="24" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">PUBLISHER</text><rect x="24" y="48" width="270" height="150" rx="10" fill="#272D50" stroke="#A6B0FF" stroke-width="1.3"/><text x="159.0" y="94.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Publisher</text><text x="159.0" y="119.2" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">thêm tiền tố độ dài, chia</text><text x="159.0" y="136.2" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">thông điệp thành k mảnh dữ liệu,</text><text x="159.0" y="153.2" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">rồi tạo shard mã hóa:</text><text x="159.0" y="170.2" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">ShredFactor x PublisherShardMultiplier</text><text x="360" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">PEER TRONG MESH</text><rect x="360" y="48" width="150" height="54" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="435.0" y="80.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Peer mesh 1</text><line x1="298" y1="123" x2="356" y2="75" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><rect x="360" y="114" width="150" height="54" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="435.0" y="146.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Peer mesh 2</text><line x1="298" y1="123" x2="356" y2="141" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><rect x="360" y="180" width="150" height="54" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="435.0" y="212.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Peer mesh 3</text><line x1="298" y1="123" x2="356" y2="207" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><text x="159" y="226" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">shard khác nhau gửi cho peer</text><text x="159" y="243" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">khác nhau, theo thứ tự vòng tròn</text><text x="580" y="34" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">NÚT NHẬN MỘT SHARD</text><rect x="580" y="48" width="356" height="296" rx="12" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><circle cx="606" cy="71" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="76" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">1</text><text x="630" y="74" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">Kiểm tra: shard không độc lập</text><text x="630" y="90" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">tuyến tính thì bị loại</text><circle cx="606" cy="123" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="128" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">2</text><text x="630" y="126" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">Lưu cùng các shard khác</text><text x="630" y="142" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">của cùng một thông điệp</text><circle cx="606" cy="175" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="180" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">3</text><text x="630" y="178" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">Giải mã khi đã có</text><text x="630" y="194" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">k shard riêng biệt</text><circle cx="606" cy="227" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="232" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">4</text><text x="630" y="230" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">Chuyển tiếp, shard từ publisher:</text><text x="630" y="246" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">gửi ngay cho mọi peer mesh</text><circle cx="606" cy="279" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="284" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">5</text><text x="630" y="282" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">Chuyển tiếp, shard từ peer: tái mã hóa</text><text x="630" y="298" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">rồi gửi khi đã nhận đủ (docs nêu</text><text x="630" y="314" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">ngưỡng theo hai cách)</text><line x1="514" y1="141" x2="576" y2="141" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><text x="24" y="380" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">THÔNG ĐIỆP ĐIỀU KHIỂN (MỞ RỘNG TỪ GOSSIPSUB)</text><rect x="24" y="394" width="912" height="170" rx="12" fill="#1E2340" stroke="#4A5280" stroke-width="1.2"/><text x="115.2" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">IDONTWANT</text><text x="115.2" y="458" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">đừng gửi thêm shard của</text><text x="115.2" y="476" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">thông điệp tôi đã</text><text x="115.2" y="494" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">giải mã xong</text><text x="297.6" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">IHAVE</text><text x="297.6" y="458" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">báo rằng nút này đang</text><text x="297.6" y="476" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">giữ shard của một</text><text x="297.6" y="494" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">thông điệp</text><text x="480.0" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">IWANT</text><text x="480.0" y="458" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">xin thêm shard của</text><text x="480.0" y="476" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">thông điệp chưa</text><text x="480.0" y="494" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">giải mã xong</text><text x="662.4" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">GRAFT</text><text x="662.4" y="458" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">thêm peer vào mesh:</text><text x="662.4" y="476" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">liên kết chỉ metadata</text><text x="662.4" y="494" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">thành liên kết đầy đủ</text><text x="844.8000000000001" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">PRUNE</text><text x="844.8000000000001" y="458" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">gỡ peer: liên kết đầy đủ</text><text x="844.8000000000001" y="476" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">trở lại thành</text><text x="844.8000000000001" y="494" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">liên kết chỉ metadata</text><text x="480" y="544" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">Kích thước mesh do MeshDegreeTarget, Min và Max quy định. Spec libp2p: mức lý tưởng là 6, chấp nhận 4 đến 12.</text></svg>