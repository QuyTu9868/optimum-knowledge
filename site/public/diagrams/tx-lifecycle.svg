<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F97BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="330" fill="#171B2E"/><rect x="24" y="70" width="124" height="76" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="86.0" y="113.1" fill="#F2F2F3" font-size="14.5" font-weight="600" text-anchor="middle">Your device</text><rect x="172" y="70" width="128" height="76" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="236.0" y="104.6" fill="#F2F2F3" font-size="14.5" font-weight="600" text-anchor="middle">Wi-Fi</text><text x="236.0" y="129.6" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">access point</text><rect x="328" y="70" width="170" height="76" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="413.0" y="104.6" fill="#F2F2F3" font-size="14.5" font-weight="600" text-anchor="middle">Shared fiber</text><text x="413.0" y="129.6" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">switches, routers</text><rect x="526" y="70" width="142" height="76" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="597.0" y="104.6" fill="#F2F2F3" font-size="14.5" font-weight="600" text-anchor="middle">Block builder</text><text x="597.0" y="129.6" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">assembles a block</text><rect x="696" y="70" width="118" height="76" rx="10" fill="#272D50" stroke="#8F97BF" stroke-width="1.3"/><text x="755.0" y="104.6" fill="#F2F2F3" font-size="14.5" font-weight="600" text-anchor="middle">Proposer</text><text x="755.0" y="129.6" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">sends the block out</text><rect x="842" y="70" width="94" height="76" rx="10" fill="#272D50" stroke="#8F97BF" stroke-width="1.3"/><text x="889.0" y="104.6" fill="#F2F2F3" font-size="14.5" font-weight="600" text-anchor="middle">Validators</text><text x="889.0" y="129.6" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">must agree</text><line x1="148" y1="108" x2="168" y2="108" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><line x1="300" y1="108" x2="324" y2="108" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><line x1="498" y1="108" x2="522" y2="108" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><line x1="668" y1="108" x2="692" y2="108" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><line x1="814" y1="108" x2="838" y2="108" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)"/><line x1="526" y1="168" x2="936" y2="168" stroke="#E3C27A" stroke-width="1.2"/><text x="731" y="190" fill="#E3C27A" font-size="12.5" font-weight="400" text-anchor="middle">the proposer must reach many validators</text><rect x="24" y="226" width="912" height="76" rx="10" fill="#272D50" stroke="#4A5280" stroke-width="1.2"/><text x="480" y="258" fill="#D6D9EA" font-size="14" font-weight="400" text-anchor="middle">Direct lines from every proposer to every validator are infeasible:</text><text x="480" y="282" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">about 1,000 validators (the real number is higher) would need roughly a million lines.</text></svg>