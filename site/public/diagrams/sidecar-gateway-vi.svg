<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="530" fill="#282C35"/><rect x="24" y="28" width="230" height="52" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="139.0" y="59.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Mạng gossip Ethereum</text><rect x="24" y="150" width="230" height="150" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="139.0" y="204.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Client đồng thuận</text><text x="139.0" y="229.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">ví dụ Prysm</text><text x="139.0" y="246.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">vẫn giữ stack libp2p</text><text x="139.0" y="263.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">thông thường (GossipSub)</text><line x1="139" y1="84" x2="139" y2="146" stroke="#969698" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="150" y="122" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="start">gossip</text><rect x="330" y="40" width="340" height="392" rx="14" fill="rgba(255,255,255,0.02)" stroke="#969698" stroke-width="1.5" stroke-dasharray="7 5"/><text x="346" y="66" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">OPTIMUM GATEWAY (CHƯƠNG TRÌNH RIÊNG)</text><rect x="352" y="84" width="296" height="74" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="500.0" y="117.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">libp2p host</text><text x="500.0" y="142.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">TCP 33212, hướng về client</text><rect x="352" y="196" width="296" height="84" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="500.0" y="226.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Chống trùng + mã hóa SSZ lại</text><text x="500.0" y="251.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">dấu vân tay XXHash,</text><text x="500.0" y="268.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">bộ đệm khoảng một phút</text><rect x="352" y="318" width="296" height="74" rx="10" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.3"/><text x="500.0" y="351.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">mump2p host</text><text x="500.0" y="376.8" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">TCP 33213, hướng về mesh</text><line x1="500" y1="160" x2="500" y2="192" stroke="#969698" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="500" y1="282" x2="500" y2="314" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)" marker-start="url(#al)"/><text x="500" y="420" fill="#B4B6BC" font-size="12" font-weight="400" text-anchor="middle">telemetry HTTP 48123: /health, /api/v1/self_info</text><line x1="258" y1="225" x2="348" y2="125" stroke="#969698" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text x="168" y="322" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">client kết nối peer với</text><text x="168" y="339" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">Gateway: một thiết lập peer,</text><text x="168" y="356" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">không sửa mã của client</text><rect x="740" y="150" width="196" height="150" rx="10" fill="#30353F" stroke="#A6B0FF" stroke-width="1.3"/><text x="838.0" y="213.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">mesh mump2p</text><text x="838.0" y="238.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">các gateway khác</text><text x="838.0" y="255.2" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">shard mã hóa RLNC</text><line x1="652" y1="355" x2="738" y2="270" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)" marker-start="url(#al)"/><rect x="24" y="452" width="912" height="62" rx="10" fill="#3A3F4A" stroke="#5B616D" stroke-width="1.2"/><text x="44" y="476" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">Optimum nói: không có điều kiện slashing mới, không truy cập khóa validator.</text><text x="44" y="498" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">ProbeLab thấy nó không đổi logic ký, trạng thái beacon hay nhiệm vụ attestation.</text></svg>