<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8F97BF"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="530" fill="#171B2E"/><rect x="24" y="28" width="230" height="52" rx="10" fill="#1E2340" stroke="#8F97BF" stroke-width="1.3"/><text x="139.0" y="59.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Ethereum gossip network</text><rect x="24" y="150" width="230" height="150" rx="10" fill="#272D50" stroke="#8F97BF" stroke-width="1.3"/><text x="139.0" y="204.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Consensus client</text><text x="139.0" y="229.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">for example Prysm</text><text x="139.0" y="246.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">keeps its own normal</text><text x="139.0" y="263.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">libp2p stack (GossipSub)</text><line x1="139" y1="84" x2="139" y2="146" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><text x="150" y="122" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="start">gossip</text><rect x="330" y="40" width="340" height="392" rx="14" fill="rgba(255,255,255,0.02)" stroke="#8F97BF" stroke-width="1.5" stroke-dasharray="7 5"/><text x="346" y="66" fill="#B4B9D6" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">OPTIMUM GATEWAY (A SEPARATE PROGRAM)</text><rect x="352" y="84" width="296" height="74" rx="10" fill="#272D50" stroke="#8F97BF" stroke-width="1.3"/><text x="500.0" y="117.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">libp2p host</text><text x="500.0" y="142.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">TCP 33212, faces the client</text><rect x="352" y="196" width="296" height="84" rx="10" fill="#272D50" stroke="#8F97BF" stroke-width="1.3"/><text x="500.0" y="226.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Dedup cache + SSZ re-encode</text><text x="500.0" y="251.2" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">XXHash fingerprint,</text><text x="500.0" y="268.2" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">cache of about one minute</text><rect x="352" y="318" width="296" height="74" rx="10" fill="#272D50" stroke="#A6B0FF" stroke-width="1.3"/><text x="500.0" y="351.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">mump2p host</text><text x="500.0" y="376.8" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">TCP 33213, faces the mesh</text><line x1="500" y1="160" x2="500" y2="192" stroke="#8F97BF" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/><line x1="500" y1="282" x2="500" y2="314" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)" marker-start="url(#al)"/><text x="500" y="420" fill="#B4B9D6" font-size="12" font-weight="400" text-anchor="middle">telemetry HTTP 48123: /health, /api/v1/self_info</text><line x1="258" y1="225" x2="348" y2="125" stroke="#8F97BF" stroke-width="1.8" marker-end="url(#a)" marker-start="url(#a)"/><text x="168" y="322" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">the client peers with the</text><text x="168" y="339" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">Gateway: one peer setting,</text><text x="168" y="356" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="middle">no client code change</text><rect x="740" y="150" width="196" height="150" rx="10" fill="#1E2340" stroke="#A6B0FF" stroke-width="1.3"/><text x="838.0" y="213.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">mump2p mesh</text><text x="838.0" y="238.2" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">other gateways</text><text x="838.0" y="255.2" fill="#B4B9D6" font-size="12.5" font-weight="400" text-anchor="middle">RLNC coded shards</text><line x1="652" y1="355" x2="738" y2="270" stroke="#A6B0FF" stroke-width="1.8" marker-end="url(#al)" marker-start="url(#al)"/><rect x="24" y="452" width="912" height="62" rx="10" fill="#272D50" stroke="#4A5280" stroke-width="1.2"/><text x="44" y="476" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">Optimum says: no new slashing conditions, no access to validator keys.</text><text x="44" y="498" fill="#D6D9EA" font-size="12.5" font-weight="400" text-anchor="start">ProbeLab found it does not change signing logic, beacon state or attestation duties.</text></svg>