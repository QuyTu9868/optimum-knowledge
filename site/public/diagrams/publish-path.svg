<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="590" fill="#282C35"/><text x="24" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">PUBLISHER</text><rect x="24" y="48" width="270" height="150" rx="10" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.3"/><text x="159.0" y="94.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Publisher</text><text x="159.0" y="119.2" fill="#B4B6BC" font-size="12" font-weight="400" text-anchor="middle">adds a length prefix, splits the</text><text x="159.0" y="136.2" fill="#B4B6BC" font-size="12" font-weight="400" text-anchor="middle">message into k fragments and</text><text x="159.0" y="153.2" fill="#B4B6BC" font-size="12" font-weight="400" text-anchor="middle">creates coded shards:</text><text x="159.0" y="170.2" fill="#B4B6BC" font-size="12" font-weight="400" text-anchor="middle">ShredFactor x PublisherShardMultiplier</text><text x="360" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MESH PEERS</text><rect x="360" y="48" width="150" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="435.0" y="80.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Mesh peer 1</text><line x1="298" y1="123" x2="356" y2="75" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><rect x="360" y="114" width="150" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="435.0" y="146.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Mesh peer 2</text><line x1="298" y1="123" x2="356" y2="141" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><rect x="360" y="180" width="150" height="54" rx="10" fill="#30353F" stroke="#969698" stroke-width="1.3"/><text x="435.0" y="212.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Mesh peer 3</text><line x1="298" y1="123" x2="356" y2="207" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><text x="159" y="226" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">different shards go to different</text><text x="159" y="243" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">peers, in round-robin order</text><text x="580" y="34" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">A NODE THAT RECEIVES A SHARD</text><rect x="580" y="48" width="356" height="296" rx="12" fill="#30353F" stroke="#969698" stroke-width="1.3"/><circle cx="606" cy="71" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="76" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">1</text><text x="630" y="74" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">Checks it: a shard that is not</text><text x="630" y="90" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">linearly independent is dropped</text><circle cx="606" cy="123" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="128" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">2</text><text x="630" y="126" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">Stores it with the other</text><text x="630" y="142" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">shards of the same message</text><circle cx="606" cy="175" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="180" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">3</text><text x="630" y="178" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">Decodes once it holds</text><text x="630" y="194" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">k unique shards</text><circle cx="606" cy="227" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="232" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">4</text><text x="630" y="230" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">Forwarding, publisher shards: sent</text><text x="630" y="246" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">to all mesh peers at once</text><circle cx="606" cy="279" r="12" fill="rgba(166,176,255,0.18)" stroke="#A6B0FF" stroke-width="1.4"/><text x="606" y="284" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">5</text><text x="630" y="282" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">Forwarding, peer shards: recoded and</text><text x="630" y="298" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">sent once enough have arrived (the docs</text><text x="630" y="314" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="start">state the threshold two ways)</text><line x1="514" y1="141" x2="576" y2="141" stroke="#A6B0FF" stroke-width="1.7" marker-end="url(#al)"/><text x="24" y="380" fill="#B4B6BC" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">CONTROL MESSAGES (THEY EXTEND GOSSIPSUB'S)</text><rect x="24" y="394" width="912" height="170" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><text x="115.2" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">IDONTWANT</text><text x="115.2" y="458" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">stop sending shards of</text><text x="115.2" y="476" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">a message I already</text><text x="115.2" y="494" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">decoded</text><text x="297.6" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">IHAVE</text><text x="297.6" y="458" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">advertises that a node</text><text x="297.6" y="476" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">holds shards of a</text><text x="297.6" y="494" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">message</text><text x="480.0" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">IWANT</text><text x="480.0" y="458" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">asks for more shards</text><text x="480.0" y="476" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">of a message not</text><text x="480.0" y="494" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">decoded yet</text><text x="662.4" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">GRAFT</text><text x="662.4" y="458" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">adds a peer to the mesh:</text><text x="662.4" y="476" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">a metadata-only link</text><text x="662.4" y="494" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">becomes a full link</text><text x="844.8000000000001" y="432" fill="#A6B0FF" font-size="14.5" font-weight="600" text-anchor="middle">PRUNE</text><text x="844.8000000000001" y="458" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">removes a peer: a full</text><text x="844.8000000000001" y="476" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">link goes back to</text><text x="844.8000000000001" y="494" fill="#D9DADC" font-size="12.5" font-weight="400" text-anchor="middle">metadata-only</text><text x="480" y="544" fill="#B4B6BC" font-size="12.5" font-weight="400" text-anchor="middle">Mesh size is set by MeshDegreeTarget, Min and Max. the libp2p spec's ideal degree is 6, 4 to 12 acceptable.</text></svg>