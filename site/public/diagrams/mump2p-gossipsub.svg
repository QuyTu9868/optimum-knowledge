<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker>
  </defs>
  <rect width="960" height="560" fill="#282C35"/>

  <!-- Lane A -->
  <text x="32" y="40" fill="#969698" font-size="12" letter-spacing="1">PLAIN GOSSIPSUB</text>
  <g font-size="14" fill="#F2F2F3" text-anchor="middle" font-weight="600">
    <rect x="60" y="58" width="150" height="56" rx="10" fill="#30353F" stroke="#969698"/><text x="135" y="91">Publisher</text>
    <rect x="405" y="58" width="150" height="56" rx="10" fill="#30353F" stroke="#969698"/><text x="480" y="91">Relay</text>
    <rect x="750" y="58" width="150" height="56" rx="10" fill="#30353F" stroke="#969698"/><text x="825" y="91">Peer</text>
  </g>
  <line x1="212" y1="86" x2="401" y2="86" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="557" y1="86" x2="746" y2="86" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="306" y="78" fill="#969698" font-size="12" text-anchor="middle">full copy</text>
  <text x="651" y="78" fill="#969698" font-size="12" text-anchor="middle">full copy</text>

  <text x="480" y="134" fill="#969698" font-size="11" text-anchor="middle">Each peer can get the same full message from several mesh peers.</text>
  <line x1="32" y1="150" x2="928" y2="150" stroke="#3A3F4A"/>

  <!-- Lane B -->
  <text x="32" y="184" fill="#969698" font-size="12" letter-spacing="1">MUMP2P CODED GOSSIP</text>
  <rect x="60" y="202" width="150" height="80" rx="10" fill="#30353F" stroke="#969698"/>
  <text x="135" y="228" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Publisher</text>
  <g font-size="10" fill="#D9DADC" text-anchor="middle">
    <rect x="72" y="244" width="38" height="24" rx="4" fill="#3A3F4A"/><text x="91" y="260">shard</text>
    <rect x="116" y="244" width="38" height="24" rx="4" fill="#3A3F4A"/><text x="135" y="260">shard</text>
    <rect x="160" y="244" width="38" height="24" rx="4" fill="#3A3F4A"/><text x="179" y="260">shard</text>
  </g>
  <rect x="405" y="202" width="150" height="80" rx="10" fill="#30353F" stroke="#969698"/>
  <text x="480" y="234" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Relay</text>
  <rect x="445" y="248" width="70" height="22" rx="11" fill="#D9DADC"/><text x="480" y="263" fill="#282C35" font-size="11" font-weight="600" text-anchor="middle">recode</text>
  <rect x="750" y="202" width="150" height="80" rx="10" fill="#30353F" stroke="#969698"/>
  <text x="825" y="234" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Peer</text>
  <text x="825" y="262" fill="#969698" font-size="12" text-anchor="middle">k independent shards</text>
  <line x1="212" y1="242" x2="401" y2="242" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="557" y1="242" x2="746" y2="242" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="306" y="234" fill="#969698" font-size="12" text-anchor="middle">coded shards</text>
  <text x="651" y="234" fill="#969698" font-size="12" text-anchor="middle">new coded shards</text>
  <text x="651" y="262" fill="#969698" font-size="11" text-anchor="middle">forward before decode</text>
  <!-- bracket -->
  <path d="M60 300 L60 310 L900 310 L900 300" stroke="#5B616D" fill="none"/>
  <text x="480" y="332" fill="#969698" font-size="13" text-anchor="middle">Builds on GossipSub, similar mesh size</text>

  <line x1="32" y1="360" x2="928" y2="360" stroke="#3A3F4A"/>

  <!-- Mixed network -->
  <text x="32" y="394" fill="#969698" font-size="12" letter-spacing="1">MIXED NETWORK</text>
  <rect x="380" y="420" width="200" height="60" rx="10" fill="#30353F" stroke="#D9DADC" stroke-width="1.5"/>
  <text x="480" y="456" fill="#F2F2F3" font-size="14" font-weight="600" text-anchor="middle">Validator (mump2p)</text>
  <rect x="60" y="420" width="170" height="60" rx="10" fill="#30353F" stroke="#969698"/>
  <text x="145" y="456" fill="#F2F2F3" font-size="14" text-anchor="middle">mump2p peer</text>
  <rect x="730" y="420" width="170" height="60" rx="10" fill="#30353F" stroke="#969698"/>
  <text x="815" y="456" fill="#F2F2F3" font-size="14" text-anchor="middle">Non-mump2p peer</text>
  <line x1="234" y1="450" x2="376" y2="450" stroke="#969698" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <line x1="584" y1="450" x2="726" y2="450" stroke="#969698" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="305" y="440" fill="#969698" font-size="12" text-anchor="middle">coded gossip</text>
  <text x="655" y="440" fill="#969698" font-size="12" text-anchor="middle">standard GossipSub</text>
  <text x="480" y="520" fill="#969698" font-size="11" text-anchor="middle">No speed numbers shown: published figures come from different setups.</text>
</svg>
