<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="Helvetica Neue, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#969698"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#E3C27A"/></marker><marker id="al" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#A6B0FF"/></marker><marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#93C3EA"/></marker></defs><rect width="960" height="400" fill="#282C35"/><rect x="24" y="24" width="444" height="330" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><rect x="492" y="24" width="444" height="330" rx="12" fill="#30353F" stroke="#5B616D" stroke-width="1.2"/><text x="44" y="56" fill="#969698" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">PLAIN COPIES</text><text x="512" y="56" fill="#969698" font-size="12" font-weight="600" text-anchor="start" letter-spacing="1">MIXES</text><rect x="56" y="90" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="121.0" y="114.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">x1</text><rect x="56" y="142" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#E3C27A" stroke-width="1.5" stroke-dasharray="5 4"/><text x="121.0" y="166.68" fill="#E3C27A" font-size="13" font-weight="600" text-anchor="middle">x1 again</text><rect x="56" y="194" width="130" height="40" rx="7" fill="#3A3F4A" stroke="#969698" stroke-width="1.5"/><text x="121.0" y="218.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">x2</text><line x1="190" y1="110" x2="296" y2="125" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><line x1="190" y1="162" x2="296" y2="160" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><line x1="190" y1="214" x2="296" y2="195" stroke="#969698" stroke-width="1.5" marker-end="url(#a)"/><rect x="300" y="100" width="140" height="120" rx="10" fill="#3A3F4A" stroke="#969698" stroke-width="1.3"/><text x="370.0" y="148.2" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Receiver</text><text x="370.0" y="173.2" fill="#969698" font-size="12.5" font-weight="400" text-anchor="middle">has x1 and x2</text><text x="370.0" y="190.2" fill="#969698" font-size="12.5" font-weight="400" text-anchor="middle">still waits for x3</text><text x="246" y="268" fill="#E3C27A" font-size="13" font-weight="400" text-anchor="middle">A repeated copy of x1 only</text><text x="246" y="287" fill="#E3C27A" font-size="13" font-weight="400" text-anchor="middle">protects against losing x1.</text><rect x="524" y="90" width="190" height="40" rx="7" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.5"/><text x="619.0" y="114.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">3x1 + 2x2 + x3</text><rect x="524" y="142" width="190" height="40" rx="7" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.5"/><text x="619.0" y="166.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">x1 + x2 + 5x3</text><rect x="524" y="194" width="190" height="40" rx="7" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.5"/><text x="619.0" y="218.68" fill="#F2F2F3" font-size="13" font-weight="600" text-anchor="middle">11x1 + 2x2 + 13x3</text><line x1="718" y1="110" x2="772" y2="125" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><line x1="718" y1="162" x2="772" y2="160" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><line x1="718" y1="214" x2="772" y2="195" stroke="#A6B0FF" stroke-width="1.6" marker-end="url(#al)"/><rect x="776" y="100" width="150" height="120" rx="10" fill="#3A3F4A" stroke="#A6B0FF" stroke-width="1.3"/><text x="851.0" y="139.8" fill="#F2F2F3" font-size="15" font-weight="600" text-anchor="middle">Receiver</text><text x="851.0" y="164.8" fill="#969698" font-size="12.5" font-weight="400" text-anchor="middle">has 3 independent</text><text x="851.0" y="181.8" fill="#969698" font-size="12.5" font-weight="400" text-anchor="middle">mixes: solves for</text><text x="851.0" y="198.8" fill="#969698" font-size="12.5" font-weight="400" text-anchor="middle">x1, x2 and x3</text><text x="714" y="268" fill="#A6B0FF" font-size="13" font-weight="400" text-anchor="middle">Any three independent mixes</text><text x="714" y="287" fill="#A6B0FF" font-size="13" font-weight="400" text-anchor="middle">are enough for three pieces.</text><text x="480" y="384" fill="#969698" font-size="12.5" font-weight="400" text-anchor="middle">Medard's whiteboard example. The numbers are for illustration, real systems use a finite field.</text></svg>